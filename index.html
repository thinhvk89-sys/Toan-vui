<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán Vui Phiêu Lưu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --bg:#DDF1FF; --surface:#FFFFFF; --soft:#EEF7FF; --ink:#1D2B53; --muted:#56678F; --line:#BBD8F3;
  --sun:#FFC83D; --sun-d:#D99A00; --grass:#2FBF71; --grass-d:#1C8F51; --coral:#FF5D5D; --coral-d:#CF3838;
  --grape:#8C6CF2; --grape-d:#6646CC; --sky:#3BA4F5; --sky-d:#1C7AC6;
  --on-sun:#1D2B53; --on-color:#FFFFFF;
  --good-bg:#DDF8E8; --bad-bg:#FFE3E3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121E3B; --surface:#1C2B52; --soft:#17254A; --ink:#F1F5FF; --muted:#A8B5D9; --line:#2E4277;
    --good-bg:#16432E; --bad-bg:#4A1F27; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121E3B; --surface:#1C2B52; --soft:#17254A; --ink:#F1F5FF; --muted:#A8B5D9; --line:#2E4277;
  --good-bg:#16432E; --bad-bg:#4A1F27; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Nunito","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.5; -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.display{font-family:"Baloo 2","Nunito",system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
input{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}

/* Chunky candy buttons: the signature element */
.btn{
  --c:var(--sky); --cd:var(--sky-d); --t:var(--on-color);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--c);color:var(--t);font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.15rem;
  padding:12px 22px;border-radius:18px;box-shadow:0 5px 0 var(--cd);
  transition:transform .08s, box-shadow .08s; min-height:52px;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sun{--c:var(--sun);--cd:var(--sun-d);--t:var(--on-sun)}
.btn.grass{--c:var(--grass);--cd:var(--grass-d)}
.btn.coral{--c:var(--coral);--cd:var(--coral-d)}
.btn.grape{--c:var(--grape);--cd:var(--grape-d)}
.btn.ghost{--c:var(--surface);--cd:var(--line);--t:var(--ink)}
.btn.block{width:100%}
.btn.small{font-size:1rem;padding:8px 14px;min-height:42px;border-radius:14px}

.panel{background:var(--surface);border-radius:24px;padding:18px;box-shadow:0 4px 0 var(--line);margin-bottom:16px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.kid{display:flex;align-items:center;gap:10px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 var(--line)}
.kid h1{font-size:1.4rem}
.chips{display:flex;gap:8px}
.chip{background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 var(--line);white-space:nowrap;font-size:.95rem}

/* Mascot */
.mascot{display:flex;gap:12px;align-items:flex-end;margin:6px 0 18px}
.owl{font-size:56px;line-height:1;flex:none}
.bubble{position:relative;background:var(--surface);border-radius:20px 20px 20px 6px;padding:12px 16px;font-weight:700;box-shadow:0 4px 0 var(--line)}

/* Progress bars */
.bar{height:16px;border-radius:999px;background:var(--soft);overflow:hidden;border:2px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .6s}
.bar.grass>i{background:var(--grass)}

/* Level path */
.path{position:relative;display:flex;flex-direction:column;gap:18px;margin:8px 0 20px}
.stop{
  --c:var(--grass);--cd:var(--grass-d);
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--c);color:var(--on-color);border-radius:26px;padding:16px 18px;box-shadow:0 7px 0 var(--cd);
  transition:transform .08s, box-shadow .08s;
}
.stop:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.stop.sun{--c:var(--sun);--cd:var(--sun-d);color:var(--on-sun)}
.stop.coral{--c:var(--coral);--cd:var(--coral-d)}
.stop:nth-child(2){margin-left:22px;width:calc(100% - 22px)}
.stop .ic{font-size:44px;line-height:1;flex:none}
.stop h3{font-size:1.45rem}
.stop p{margin:0;font-weight:700;opacity:.92;font-size:.95rem}
.stop.locked{filter:grayscale(.85);opacity:.7}
.stop .lv{margin-left:auto;font-family:"Baloo 2";font-weight:800;font-size:1.1rem;background:rgba(255,255,255,.3);border-radius:14px;padding:4px 10px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:3px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px}
.nav button{flex:1;max-width:170px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.85rem;padding:6px;border-radius:16px;color:var(--muted)}
.nav button span{font-size:26px;line-height:1.1}
.nav button[aria-current="page"]{background:var(--soft);color:var(--ink)}

/* Quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.x{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:0 3px 0 var(--line);font-size:20px;font-weight:800;flex:none}
.dots{display:flex;gap:5px;flex:1}
.dots i{flex:1;height:12px;border-radius:6px;background:var(--surface);border:2px solid var(--line)}
.dots i.ok{background:var(--grass);border-color:var(--grass-d)}
.dots i.no{background:var(--coral);border-color:var(--coral-d)}
.dots i.now{background:var(--sun);border-color:var(--sun-d)}
.combo{font-weight:800;font-family:"Baloo 2";font-size:1.1rem;min-width:56px;text-align:right}
.qcard{background:var(--surface);border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 6px 0 var(--line);margin-bottom:18px;position:relative}
.qask{font-weight:800;color:var(--muted);margin-bottom:8px}
.qtext{font-family:"Baloo 2";font-weight:800;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.2;word-break:break-word}
.qtext.story{font-family:"Nunito";font-weight:700;font-size:1.2rem;line-height:1.5;text-align:left}
.qtext .box{display:inline-block;min-width:1.4em;border:4px dashed var(--sun-d);border-radius:12px;padding:0 .2em;color:var(--sun-d)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{--c:var(--surface);--cd:var(--line);background:var(--c);color:var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--cd);
  font-family:"Baloo 2";font-weight:800;font-size:clamp(1.5rem,6.5vw,2rem);padding:14px 8px;min-height:84px;transition:transform .08s, box-shadow .08s}
.opt:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd)}
.opt.ok{--c:var(--grass);--cd:var(--grass-d);color:#fff}
.opt.no{--c:var(--coral);--cd:var(--coral-d);color:#fff}
.opt[disabled]{cursor:default}
.feedback{margin-top:18px;border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.feedback.good{background:var(--good-bg)}
.feedback.bad{background:var(--bad-bg)}
.feedback .owl{font-size:44px}
.feedback b{font-family:"Baloo 2";font-size:1.25rem;display:block}
.pop{position:absolute;right:18px;top:12px;font-family:"Baloo 2";font-weight:800;font-size:1.5rem;color:var(--grass-d);animation:pop 1s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* Result */
.result{text-align:center}
.bigstars{font-size:64px;letter-spacing:6px;margin:6px 0}
.bigstars span{display:inline-block;opacity:.18;filter:grayscale(1)}
.bigstars span.on{opacity:1;filter:none;animation:starIn .5s both}
.bigstars span.on:nth-child(2){animation-delay:.25s}
.bigstars span.on:nth-child(3){animation-delay:.5s}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.score{font-family:"Baloo 2";font-weight:800;font-size:3.2rem;line-height:1}
.gain{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.newthing{display:flex;align-items:center;gap:12px;text-align:left;background:var(--soft);border-radius:18px;padding:10px 14px;margin-top:10px}
.newthing .e{font-size:38px}

/* Collections */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{aspect-ratio:1;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:34px;border:3px dashed var(--line)}
.slot.got{background:var(--surface);border:3px solid var(--sun);box-shadow:0 4px 0 var(--sun-d)}
.slot.lock{color:var(--muted);font-family:"Baloo 2";font-weight:800;font-size:1.6rem}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:18px;padding:10px}
.badge .e{font-size:32px;flex:none}
.badge.off .e{filter:grayscale(1);opacity:.35}
.badge b{display:block;font-size:.95rem;line-height:1.2}
.badge small{color:var(--muted);font-size:.8rem;line-height:1.25;display:block}
.trophies{display:flex;flex-wrap:wrap;gap:10px}
.trophy{flex:1 1 30%;text-align:center;background:var(--soft);border-radius:18px;padding:10px 6px}
.trophy .e{font-size:36px}
.trophy.off .e{filter:grayscale(1);opacity:.35}
.trophy small{display:block;color:var(--muted);font-weight:700}

/* Forms */
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-weight:800;margin-bottom:8px}
.text{width:100%;border:3px solid var(--line);background:var(--soft);border-radius:16px;padding:12px 14px;font-size:1.15rem;font-weight:700}
.picks{display:flex;flex-wrap:wrap;gap:10px}
.pick{min-width:56px;height:56px;border-radius:16px;background:var(--soft);border:3px solid var(--line);font-size:28px;font-family:"Baloo 2";font-weight:800}
.pick.txt{font-size:1.2rem;padding:0 14px}
.pick[aria-pressed="true"]{background:var(--sun);border-color:var(--sun-d);color:var(--on-sun)}
.pin{display:flex;gap:10px;justify-content:center;margin:12px 0}
.pin i{width:22px;height:22px;border-radius:50%;border:3px solid var(--line)}
.pin i.f{background:var(--grape);border-color:var(--grape-d)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keypad .btn{font-size:1.5rem}

/* Parent dashboard */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:18px;padding:12px}
.stat b{font-family:"Baloo 2";font-size:1.7rem;display:block;line-height:1.1}
.stat small{color:var(--muted);font-weight:700}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;height:auto;min-width:300px}
.trow{display:grid;grid-template-columns:8.5em 1fr 3.2em;gap:10px;align-items:center;margin:8px 0;font-weight:700;font-size:.95rem}
.trow .bar{height:14px}
.tag{display:inline-block;font-size:.75rem;font-weight:800;border-radius:8px;padding:1px 7px;margin-left:4px;background:var(--bad-bg);color:var(--coral-d)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line);font-weight:700;font-size:.95rem}
.hist li:last-child{border:0}
.kidtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.kidtabs button{flex:none;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--surface);font-weight:800;box-shadow:0 3px 0 var(--line)}
.kidtabs button[aria-pressed="true"]{background:var(--grape);color:#fff;box-shadow:0 3px 0 var(--grape-d)}
.tips{margin:0;padding-left:1.2em}
.tips li{margin:6px 0}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line)}
.setting:last-child{border:0}
.stepper{display:flex;align-items:center;gap:10px;font-family:"Baloo 2";font-weight:800;font-size:1.3rem}
.switch{width:58px;height:34px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--grass)}
.switch[aria-checked="true"]::after{left:28px}
h2{font-size:1.45rem;margin-bottom:10px}
h3.sub{font-size:1.15rem;margin:0 0 8px}
.modal{position:fixed;inset:0;background:rgba(10,20,45,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal .panel{max-width:420px;width:100%;margin:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;z-index:60}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="nav" id="nav" hidden>
  <button data-go="home"><span>🗺️</span>Học</button>
  <button data-go="album"><span>🎁</span>Bộ sưu tập</button>
  <button data-go="parent"><span>👨‍👩‍👧</span>Phụ huynh</button>
</nav>
<script>
/* ---------- Constants ---------- */
const AVATARS=['🐯','🐼','🐰','🦊','🐸','🐨','🐵','🦁'];
const STICKERS=['🦄','🐳','🦖','🐙','🦋','🐢','🦜','🐝','🦀','🐞','🦩','🐬','🦔','🐧','🦒','🐘'];
const LEVELS={
  de:{name:'Dễ',place:'Đồi Hạt Mầm',icon:'🌱',mult:1,need:0,cls:''},
  vua:{name:'Vừa',place:'Rừng Phép Tính',icon:'🌳',mult:2,need:5,cls:'sun'},
  kho:{name:'Khó',place:'Đỉnh Núi Thông Thái',icon:'🏔️',mult:3,need:15,cls:'coral'}
};
const MILESTONES=[
  {p:100,name:'Cúp Đồng',icon:'🥉'},{p:300,name:'Cúp Bạc',icon:'🥈'},{p:600,name:'Cúp Vàng',icon:'🥇'},
  {p:1000,name:'Kim Cương',icon:'💎'},{p:2000,name:'Vương Miện',icon:'👑'},{p:4000,name:'Huyền Thoại',icon:'🏆'}
];
const BADGES=[
  {id:'first',icon:'🎈',name:'Bước đầu tiên',desc:'Hoàn thành bài đầu tiên'},
  {id:'perfect',icon:'🌟',name:'Điểm tuyệt đối',desc:'Đúng cả 10/10 câu'},
  {id:'combo5',icon:'🔥',name:'Chuỗi lửa',desc:'Đúng liền 5 câu'},
  {id:'combo10',icon:'☄️',name:'Sao chổi',desc:'Đúng liền 10 câu'},
  {id:'streak3',icon:'📅',name:'Chăm chỉ',desc:'Học 3 ngày liền'},
  {id:'streak7',icon:'🗓️',name:'Siêu bền bỉ',desc:'Học 7 ngày liền'},
  {id:'goal',icon:'🎯',name:'Về đích',desc:'Xong mục tiêu của ngày'},
  {id:'c100',icon:'💯',name:'Trăm câu đúng',desc:'Đúng tổng cộng 100 câu'},
  {id:'fast',icon:'⚡',name:'Tia chớp',desc:'Xong bài dưới 1 phút, đúng từ 8 câu'},
  {id:'kho',icon:'🧗',name:'Nhà leo núi',desc:'Đạt 3 sao ở mức Khó'}
];
const TOPICS={cong:'Phép cộng',tru:'Phép trừ',nhan:'Phép nhân',chia:'Phép chia',sosanh:'So sánh số',timx:'Tìm số còn thiếu',loigiai:'Toán có lời văn',phanso:'Phân số',thapphan:'Số thập phân',phantram:'Tỉ số phần trăm'};
/* Chương trình GDPT 2018: mỗi lớp chia 4 giai đoạn theo học kỳ */
const STAGES=['Đầu học kỳ 1','Cuối học kỳ 1','Đầu học kỳ 2','Cuối học kỳ 2'];
const STAGE_SHORT=['Đầu HK1','Cuối HK1','Đầu HK2','Cuối HK2'];
const CURR={
1:[
 {desc:'Các số đến 10; cộng, trừ trong phạm vi 10',topics:['sosanh','cong','tru','cong','tru'],max:[5,10]},
 {desc:'Cộng, trừ trong phạm vi 10; tìm số; bài toán có lời văn',topics:['sosanh','cong','tru','timx','loigiai'],max:[6,10]},
 {desc:'Các số đến 100; cộng, trừ các số tròn chục',topics:['sosanh','cong','tru','timx'],max:[20,100],tens:true},
 {desc:'Cộng, trừ không nhớ trong phạm vi 100',topics:['sosanh','cong','tru','timx','loigiai'],max:[30,100],noCarry:true}
],
2:[
 {desc:'Cộng, trừ có nhớ qua 10 trong phạm vi 20',topics:['cong','tru','timx','loigiai'],max:[10,20],carry20:true},
 {desc:'Cộng, trừ có nhớ trong phạm vi 100',topics:['cong','tru','sosanh','timx','loigiai'],max:[40,100]},
 {desc:'Phép nhân, phép chia (bảng 2 và 5); các số đến 1000',topics:['nhan','chia','sosanh','timx','loigiai'],max:[100,1000],tables:[2,5],mul:['table']},
 {desc:'Cộng, trừ trong phạm vi 1000; nhân, chia bảng 2 và 5',topics:['cong','tru','nhan','chia','timx','loigiai'],max:[200,1000],tables:[2,5],mul:['table']}
],
3:[
 {desc:'Bảng nhân, bảng chia từ 2 đến 9',topics:['nhan','chia','nhan','timx','loigiai'],max:[100,1000],tables:[2,3,4,5,6,7,8,9],mul:['table']},
 {desc:'Nhân, chia số có hai, ba chữ số với số có một chữ số',topics:['nhan','chia','cong','tru','timx','loigiai'],max:[200,1000],tables:[2,3,4,5,6,7,8,9],mul:['table','2x1','3x1']},
 {desc:'Các số đến 10 000; cộng, trừ trong phạm vi 10 000',topics:['sosanh','cong','tru','timx','loigiai'],max:[1000,10000],mul:['2x1']},
 {desc:'Các số đến 100 000; cộng, trừ, nhân, chia',topics:['cong','tru','nhan','chia','timx','loigiai'],max:[10000,100000],mul:['3x1','4x1']}
],
4:[
 {desc:'Số có nhiều chữ số; cộng, trừ các số có nhiều chữ số',topics:['sosanh','cong','tru','timx','loigiai'],max:[10000,1000000],mul:['3x1']},

let actx=null;
function tone(freqs,dur=.12,type='sine'){
  if(!S.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type;o.frequency.value=f;o.connect(g);g.connect(actx.destination);
      const t=actx.currentTime+i*dur;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.start(t);o.stop(t+dur+.02);
    });
  }catch(e){}
}

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n=80){
  if(reduce)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#FFC83D','#2FBF71','#FF5D5D','#8C6CF2','#3BA4F5'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+rnd(-60,60),y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:rnd(6,11),c:pick(cols),r:Math.random()*6,life:0});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+20&&p.life<200);
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),null);
}

/* ---------- Question generator (theo chương trình, tăng dần độ khó) ---------- */
const lerp=(a,b,d)=>a+(b-a)*d;
const r3=x=>Math.round(x*1000)/1000;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const maxFor=(P,d)=>Math.max(2,Math.round(lerp(P.max[0],P.max[1],d)));
const modeAt=(arr,d)=>arr[Math.max(0,Math.min(arr.length-1,Math.floor(d*arr.length+Math.random()-.5)))];
function numOpts(ans,step=1){
  const set=new Set([r2(ans)]);
  const c=shuffle([ans+step,ans-step,ans+10*step,ans-10*step,ans+2*step,ans-2*step,ans+rnd(3,9)*step,ans-rnd(3,9)*step]);
  for(const v of c){if(set.size>=4)break;if(v>=0)set.add(r2(v))}
  let k=1;while(set.size<4){set.add(r2(ans+(10+k)*step));k++}
  return shuffle([...set]).map(fmt);
}
function strOpts(ans,cands){
  const set=new Set([ans]);for(const w of shuffle(cands)){if(set.size>=4)break;if(w&&!/^-|\/0$|^0\//.test(w))set.add(w)}
  let k=2;while(set.size<4){set.add(ans.includes('/')?`${k}/${k+5}`:`${k*7}%`);k++}
  return shuffle([...set]);
}
function addPair(P,d){
  if(P.carry20){if(d<.25){const a=rnd(1,8);return [a,rnd(1,10-a)]}const a=rnd(2,9);return [a,rnd(11-a,9)]}
  const M=maxFor(P,d);
  if(P.tens){const T=Math.max(2,Math.floor(M/10));const a=rnd(1,T-1);return [a*10,rnd(1,T-a)*10]}
  const lo=M>=100?Math.floor(M/10):1;
  for(let k=0;k<60;k++){const a=rnd(lo,M-1),b=rnd(M>=100?Math.max(1,Math.floor(M/20)):1,Math.max(1,M-a));if(a+b<=M&&(!P.noCarry||(a%10)+(b%10)<10))return [a,b]}
  return [Math.floor(M/2),Math.floor(M/4)];
}
function subPair(P,d){
  if(P.carry20){if(d<.25){const a=rnd(2,10);return [a,rnd(1,a)]}const a=rnd(11,18);return [a,rnd(Math.max(a%10+1,a-9),9)]}
  const M=maxFor(P,d);
  if(P.tens){const T=Math.max(2,Math.floor(M/10));const a=rnd(2,T);return [a*10,rnd(1,a)*10]}
  const lo=M>=100?Math.floor(M/10):2;
  for(let k=0;k<60;k++){const a=rnd(lo,M),b=rnd(1,a);if(!P.noCarry||(a%10)>=(b%10))return [a,b]}
  return [M,Math.floor(M/2)];
}
function mulPair(P,d){
  const kind=modeAt(P.mul||['table'],d);
  if(kind==='table'){const T=P.tables||[2,3,4,5];const n=Math.max(1,Math.ceil(T.length*(.4+.6*d)));return [pick(T.slice(0,n)),rnd(1,d<.3?5:10),kind]}
  const one=rnd(2,d<.4?5:9);
  if(kind==='2x1')return [rnd(11,d<.5?40:99),one,kind];
  if(kind==='3x1')return [rnd(100,d<.5?400:999),one,kind];
  if(kind==='4x1')return [rnd(1000,d<.5?4000:9999),one,kind];
  if(kind==='2x2')return [rnd(11,99),rnd(11,d<.6?20:99),kind];
  return [rnd(100,999),rnd(11,d<.6?30:99),kind];
}
function divPair(P,d){const [a,b,kind]=mulPair(P,d);return kind==='table'?[a*b,a,b]:[a*b,b,a]}
const BOX='<span class="box">?</span>';
function q_cong(P,d){const [a,b]=addPair(P,d);return {ask:'Tính',text:`${fmt(a)} + ${fmt(b)} = ${BOX}`,ans:fmt(a+b),opts:numOpts(a+b,P.tens?10:1),exp:`${fmt(a)} + ${fmt(b)} = ${fmt(a+b)}`}}
function q_tru(P,d){const [a,b]=subPair(P,d);return {ask:'Tính',text:`${fmt(a)} − ${fmt(b)} = ${BOX}`,ans:fmt(a-b),opts:numOpts(a-b,P.tens?10:1),exp:`${fmt(a)} − ${fmt(b)} = ${fmt(a-b)}`}}
function q_nhan(P,d){const [a,b]=mulPair(P,d);return {ask:'Tính',text:`${fmt(a)} × ${fmt(b)} = ${BOX}`,ans:fmt(a*b),opts:numOpts(a*b,a*b>50?Math.min(a,b):1),exp:`${fmt(a)} × ${fmt(b)} = ${fmt(a*b)}`}}

function decCmp(d){
  const ip=rnd(0,20);let a,b;
  if(d<.4){a=ip+rnd(1,9)/10;b=(Math.random()<.6?ip:ip+1)+rnd(1,9)/10}
  else{a=ip+rnd(1,9)/10;b=ip+rnd(1,99)/100;if(Math.random()<.5)[a,b]=[b,a]}
  a=r2(a);b=r2(b);const s=a>b?'>':a<b?'<':'=';
  return {ask:'Chọn dấu đúng',text:`${fmt(a)} ${BOX} ${fmt(b)}`,ans:s,opts:['>','<','='],exp:`So sánh phần nguyên trước, rồi so sánh từng hàng của phần thập phân: ${fmt(a)} ${s} ${fmt(b)}`};
}
function q_sosanh(P,d){

  if(M>=1000){
    L=rnd(Math.floor(M/10),M);const dg=String(L).length;

  }else if(d<.45||M<6){L=rnd(0,M);R=Math.random()<.2?L:rnd(0,M);if(P.tens){L=Math.round(L/10)*10;R=Math.round(R/10)*10}lt=fmt(L);rt=fmt(R)}
  else{
    const [a,b]=addPair(P,d);L=a+b;lt=`${fmt(a)} + ${fmt(b)}`;
    if(d<.75){R=Math.max(0,Math.random()<.3?L:L+rnd(-3,3)*(P.tens?10:1));rt=fmt(R)}
    else{const c=rnd(1,Math.max(1,L-1));const t=Math.random()<.3?L:L+rnd(-2,2);const e=Math.max(0,t-c);R=c+e;rt=`${fmt(c)} + ${fmt(e)}`}

}
function q_timx(P,d){
  const t=(P.mul&&d>=.4&&Math.random()<.5)?'nhan':pick(['cong','tru']);
  if(t==='nhan'){const [a,b]=mulPair(P,d);return {ask:'Tìm số còn thiếu',text:`${fmt(a)} × ${BOX} = ${fmt(a*b)}`,ans:fmt(b),opts:numOpts(b),exp:`Số cần tìm là ${fmt(a*b)} : ${fmt(a)} = ${fmt(b)}`}}
  if(t==='cong'){const [a,b]=addPair(P,d);return {ask:'Tìm số còn thiếu',text:`${BOX} + ${fmt(a)} = ${fmt(a+b)}`,ans:fmt(b),opts:numOpts(b,P.tens?10:1),exp:`Số cần tìm là ${fmt(a+b)} − ${fmt(a)} = ${fmt(b)}`}}
  const [a,b]=subPair(P,d);return {ask:'Tìm số còn thiếu',text:`${fmt(a)} − ${BOX} = ${fmt(a-b)}`,ans:fmt(b),opts:numOpts(b,P.tens?10:1),exp:`Số cần tìm là ${fmt(a)} − ${fmt(a-b)} = ${fmt(b)}`};

function q_loigiai(P,d){
  const name=pick(['An','Bình','Mai','Lan','Minh','Hoa','Tú','Nam']);

  if(P.frac)kinds.push('fracOf','fracOf');
  if(P.pct)kinds.push('pct','pct');
  if(d>.65&&maxFor(P,1)>=20)kinds.push('two');
  const k=pick(kinds);let text,ans,exp,opts;
  if(k==='add'){const [a,b]=addPair(P,d);text=`${name} có ${fmt(a)} ${obj}, mẹ cho thêm ${fmt(b)} ${obj}. Hỏi ${name} có tất cả bao nhiêu ${obj}?`;ans=a+b;exp=`${fmt(a)} + ${fmt(b)} = ${fmt(ans)} ${obj}`}

    text=`Một lớp học có ${X} bạn, trong đó ${m}/${n} số bạn thích môn Toán. Hỏi lớp có bao nhiêu bạn thích môn Toán?`;exp=`${X} : ${n} × ${m} = ${ans} bạn`}

    text=`${name} có ${fmt(a)} ${obj}. ${other} có nhiều hơn ${name} ${fmt(b)} ${obj}. Hỏi cả hai bạn có tất cả bao nhiêu ${obj}?`;ans=a+(a+b);exp=`${other} có ${fmt(a)} + ${fmt(b)} = ${fmt(a+b)}. Cả hai có ${fmt(a)} + ${fmt(a+b)} = ${fmt(ans)} ${obj}`}
  return {ask:'Giải toán',text,story:true,ans:fmt(ans),opts:numOpts(ans),exp};

const fr=(a,b)=>`${a}/${b}`;
function q_phanso(P,d){

  }

    if(mode==='cmp'){n1=n2=rnd(3,12);a=rnd(1,n1-1);b=Math.random()<.15?a:rnd(1,n1-1)}

    return {ask:'Chọn dấu đúng',text:`${fr(a,n1)} ${BOX} ${fr(b,n2)}`,ans:s,opts:['>','<','='],exp:mode==='cmp'?'Hai phân số cùng mẫu số: phân số nào có tử số lớn hơn thì lớn hơn.':'Hai phân số cùng tử số: phân số nào có mẫu số bé hơn thì lớn hơn.'};

  }
  if(mode==='addDiff'){

    do{b=rnd(2,5);k=rnd(2,3);D=b*k;a=rnd(1,b-1);c=rnd(1,D-1);top=a*k+c;t++}while(gcd(top,D)>1&&t<20);

function q_thapphan(P,d){

  if(mode==='mul10'||mode==='div10'){
    const x=rnd(11,999)/10,m=pick([10,100]),mul=mode==='mul10',ans=mul?r3(x*m):r3(x/m);
    const o=new Set([fmt(ans)]);[mul?r3(x*m/10):r3(x/m*10),mul?r3(x*m*10):r3(x/m/10),r3(mul?x+m:Math.abs(x-m)),r3(ans+1)].forEach(v=>{if(o.size<4)o.add(fmt(v))});
    return {ask:'Tính',text:`${fmt(x)} ${mul?'×':':'} ${m} = ${BOX}`,ans:fmt(ans),opts:shuffle([...o]),exp:`${mul?'Nhân':'Chia'} cho ${m}: dời dấu phẩy sang ${mul?'phải':'trái'} ${m===10?'một':'hai'} chữ số, được ${fmt(ans)}`};
  }
  if(mode==='mulint'){const x=rnd(11,d<.5?49:99)/10,k=rnd(2,9),ans=r2(x*k);return {ask:'Tính',text:`${fmt(x)} × ${k} = ${BOX}`,ans:fmt(ans),opts:numOpts(ans,.1),exp:`Nhân như số tự nhiên rồi đặt dấu phẩy: ${fmt(x)} × ${k} = ${fmt(ans)}`}}
  const sc=d<.5?10:100;let a=rnd(11,d<.5?99:9999)/sc,b=rnd(11,d<.5?99:9999)/sc;
  if(mode==='sub'&&a<b)[a,b]=[b,a];
  const ans=mode==='sub'?r2(a-b):r2(a+b),op=mode==='sub'?'−':'+';
  return {ask:'Tính',text:`${fmt(a)} ${op} ${fmt(b)} = ${BOX}`,ans:fmt(ans),opts:numOpts(ans,1/sc),exp:`Đặt thẳng dấu phẩy rồi ${mode==='sub'?'trừ':'cộng'}: ${fmt(a)} ${op} ${fmt(b)} = ${fmt(ans)}`};
}
function q_phantram(P,d){
  if(d<.7){
    const X=rnd(1,10)*20,p=d<.35?pick([10,25,50]):rnd(1,19)*5,ans=X*p/100;
    return {ask:'Tính',text:`${p}% của ${X} = ${BOX}`,ans:fmt(ans),opts:numOpts(ans,ans>20?5:1),exp:`${X} : 100 × ${p} = ${fmt(ans)}`};
  }
  let a,b,p,t=0;do{b=pick([20,25,40,50,80]);p=pick([10,20,25,40,50,60,75,80]);a=b*p/100;t++}while(!Number.isInteger(a)&&t<30);
  const ans=`${p}%`;
  return {ask:'Tìm tỉ số phần trăm',text:`Tỉ số phần trăm của ${a} và ${b} là ${BOX}`,ans,opts:strOpts(ans,[`${p+5}%`,`${p-5}%`,`${p*2}%`,`${a}%`,`${b}%`]),exp:`${a} : ${b} = ${fmt(a/b)} = ${p}%`};
}
const GEN={cong:q_cong,tru:q_tru,nhan:q_nhan,chia:q_chia,sosanh:q_sosanh,timx:q_timx,loigiai:q_loigiai,phanso:q_phanso,thapphan:q_thapphan,phantram:q_phantram};
const WEIGHT={sosanh:0,cong:1,tru:1.3,nhan:1.5,chia:1.9,phanso:1.5,thapphan:1.5,phantram:1.5,timx:2.6,loigiai:3.2};
/* 10 câu: dạng bài dễ trước, khó sau */
function makePlan(P,n=10){
  let pool=[];while(pool.length<n)pool=pool.concat(shuffle([...P.topics]));
  return pool.slice(0,n).map(t=>({t,w:WEIGHT[t]+Math.random()*1.2})).sort((a,b)=>a.w-b.w).map(x=>x.t);
}
/* Độ khó tăng dần theo thứ tự câu, tự giảm khi con vừa trả lời sai */
function diffAt(lv,i,res){
  let d={de:0,vua:.33,kho:.66}[lv]+(i/9)*.34;
  const n=res.length;
  if(n>=2&&!res[n-1]&&!res[n-2])d-=.3;else if(n&&!res[n-1])d-=.12;
  return Math.min(1,Math.max(0,d));
}
function genQ(P,topic,d,seen){
  let q,tries=0;do{q=GEN[topic](P,d);tries++}while(seen.has(q.text)&&tries<8);
  seen.add(q.text);q.topic=topic;q.d=d;
  if(!q.opts.includes(q.ans)){q.opts[0]=q.ans;shuffle(q.opts)}
  return q;
}

function startQuiz(lv){
  const c=kid();

}
function renderQuiz(){
  if(!Q.qs[Q.i])Q.qs[Q.i]=genQ(Q.P,Q.plan[Q.i],diffAt(Q.lv,Q.i,Q.res),Q.seen);
  const q=Q.qs[Q.i];

  app.innerHTML=`

    const m=document.createElement('div');m.className='modal';

function answer(btn){
  if(Q.answered)return;Q.answered=true;
  const q=Q.qs[Q.i],ok=btn.dataset.o===q.ans,sec=(Date.now()-Q.qStart)/1000;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.o===q.ans)b.classList.add('ok')});
  Q.res.push(ok);q.ok=ok;q.sec=sec;
  const fb=$('#fb');
  if(ok){
    Q.combo++;Q.best=Math.max(Q.best,Q.combo);
    const m=LEVELS[Q.lv].mult;let p=10*m;if(sec<8)p+=2*m;if(Q.combo>=3)p+=5;Q.pts+=p;

/* Finish & rewards */
let lastResult=null;
function finishQuiz(){
  const c=kid(),now=new Date(),today=dayKey(now),yest=dayKey(new Date(Date.now()-864e5));
  const correct=Q.res.filter(Boolean).length,sec=Math.round((Date.now()-Q.start)/1000);
  const stars=correct===10?3:correct>=8?2:correct>=5?1:0;
  const beforePts=c.points,beforeStars=c.stars;
  c.points+=Q.pts;c.stars+=stars;c.correct+=correct;c.answered+=10;c.timeSec+=sec;c.bestCombo=Math.max(c.bestCombo,Q.best);
  c.level[Q.lv].c+=correct;c.level[Q.lv].t+=10;
  Q.qs.forEach(q=>{const t=c.topic[q.topic]||(c.topic[q.topic]={c:0,t:0});t.t++;if(q.ok)t.c++});
  c.sessions.push({d:Date.now(),lv:Q.lv,c:correct,pts:Q.pts,sec,st:stars,wrong:Q.qs.filter(q=>!q.ok).map(q=>q.topic)});
  if(c.sessions.length>80)c.sessions=c.sessions.slice(-80);
  if(c.streak.last!==today){c.streak.n=c.streak.last===yest?c.streak.n+1:1;c.streak.last=today}
  if(c.today.d!==today)c.today={d:today,n:0};c.today.n++;
  const newB=[];const give=id=>{if(!c.badges.includes(id)){c.badges.push(id);newB.push(BADGES.find(b=>b.id===id))}};
  give('first');if(correct===10)give('perfect');if(Q.best>=5)give('combo5');if(Q.best>=10)give('combo10');
  if(c.streak.n>=3)give('streak3');if(c.streak.n>=7)give('streak7');if(c.today.n>=c.goal)give('goal');
  if(c.correct>=100)give('c100');if(sec<60&&correct>=8)give('fast');if(Q.lv==='kho'&&stars===3)give('kho');
  let sticker=null;
  if(stars===3){const left=STICKERS.filter(s=>!c.stickers.includes(s));if(left.length){sticker=pick(left);c.stickers.push(sticker)}}
  const trophy=MILESTONES.filter(m=>beforePts<m.p&&c.points>=m.p).pop()||null;
  const unlocked=Object.entries(LEVELS).filter(([k,L])=>L.need>0&&beforeStars<L.need&&c.stars>=L.need&&!c.unlockAll).map(([k,L])=>L);
  const goalHit=c.today.n===c.goal;
  save();
  lastResult={correct,pts:Q.pts,stars,sec,newB,sticker,trophy,unlocked,goalHit,lv:Q.lv,best:Q.best};
  Q=null;go('result');
}

  <h2>Bộ sưu tập của ${esc(c.name)}</h2>
  <div class="panel"><h3 class="sub">Cúp cột mốc</h3>
    <div class="trophies">${MILESTONES.map(m=>`<div class="trophy ${c.points>=m.p?'':'off'}"><div class="e">${m.icon}</div><b>${m.name}</b><small>${fmt(m.p)} điểm</small></div>`).join('')}</div></div>
  <div class="panel"><div class="row between"><h3 class="sub">Nhãn dán</h3><b class="muted">${c.stickers.length}/${STICKERS.length}</b></div>
    <p class="muted" style="margin:0 0 10px;font-weight:700">Đạt 3 sao trong một bài để nhận nhãn dán mới.</p>
    <div class="grid">${STICKERS.map(s=>c.stickers.includes(s)?`<div class="slot got">${s}</div>`:`<div class="slot lock">?</div>`).join('')}</div></div>
  <div class="panel"><div class="row between"><h3 class="sub">Huy hiệu</h3><b class="muted">${c.badges.length}/${BADGES.length}</b></div>
    <div class="badges">${BADGES.map(b=>`<div class="badge ${c.badges.includes(b.id)?'':'off'}"><span class="e">${b.icon}</span><div><b>${b.name}</b><small>${b.desc}</small></div></div>`).join('')}</div></div>`;
}

/* Parent area */
function renderParent(){
  if(!parentOpen)return renderGate();
  renderDash();
}
function renderGate(){
  if(!pinStage)pinStage=S.pin?'enter':'create';
  const title={enter:'Nhập mã PIN phụ huynh',create:'Tạo mã PIN 4 số cho phụ huynh',confirm:'Nhập lại mã PIN để xác nhận'}[pinStage];
  app.innerHTML=`
  <div class="panel center">
    <div style="font-size:48px">🔐</div>
    <h2>${title}</h2>
    <p class="muted" style="margin:0;font-weight:700">${pinStage==='enter'?'Khu vực dành cho bố mẹ theo dõi kết quả học của con.':'Mã này giúp con không vào nhầm khu vực của bố mẹ.'}</p>
    <div class="pin" aria-label="Đã nhập ${pinBuf.length} số">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn ghost" data-n="${n}">${n}</button>`).join('')}
      <span></span><button class="btn ghost" data-n="0">0</button><button class="btn ghost" data-n="del" aria-label="Xoá">⌫</button></div>
  </div>`;
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.n;sfx.tap();
    if(n==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=n;
    if(pinBuf.length===4){
      if(pinStage==='create'){pinFirst=pinBuf;pinBuf='';pinStage='confirm'}
      else if(pinStage==='confirm'){if(pinBuf===pinFirst){S.pin=pinBuf;save();parentOpen=true;pinStage=null;pinBuf='';toast('Đã tạo mã PIN');return renderDash()}else{toast('Hai mã chưa khớp, tạo lại nhé');pinStage='create';pinBuf=''}}
      else{if(pinBuf===S.pin){parentOpen=true;pinStage=null;pinBuf='';return renderDash()}else{toast('Sai mã PIN');pinBuf=''}}
    }
    renderGate();
  });
}
let dashKid=null;
function pct(c,t){return t?Math.round(c/t*100):0}
function accuracyChart(sessions){
  const s=sessions.slice(-14);if(!s.length)return '<p class="muted">Chưa có bài nào. Biểu đồ sẽ hiện sau bài học đầu tiên.</p>';
  const W=340,H=170,pl=34,pr=10,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  const x=i=>pl+(s.length===1?iw/2:i*iw/(s.length-1)),y=v=>pt+ih-(v/10)*ih;
  const col={de:'var(--grass)',vua:'var(--sun-d)',kho:'var(--coral)'};
  let g='';[0,5,10].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-weight="700">${v}</text>`});
  const pts=s.map((e,i)=>`${x(i)},${y(e.c)}`).join(' ');
  const dots=s.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e.c)}" r="5.5" fill="${col[e.lv]}" stroke="var(--surface)" stroke-width="2"><title>${new Date(e.d).toLocaleDateString('vi-VN')} · ${LEVELS[e.lv].name} · ${e.c}/10</title></circle>`).join('');
  const lab=s.map((e,i)=>(i===0||i===s.length-1)?`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':'end'}" font-size="11" fill="var(--muted)" font-weight="700">${new Date(e.d).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Số câu đúng trong ${s.length} bài gần nhất">${g}<polyline points="${pts}" fill="none" stroke="var(--grape)" stroke-width="3" stroke-linejoin="round"/>${dots}${lab}</svg>
  <div class="row muted" style="font-size:.85rem;font-weight:700;gap:14px;flex-wrap:wrap"><span><span style="color:var(--grass)">●</span> Dễ</span><span><span style="color:var(--sun-d)">●</span> Vừa</span><span><span style="color:var(--coral)">●</span> Khó</span></div>`;
}
function weekChart(sessions){
  const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);days.push({k:dayKey(d),l:['CN','T2','T3','T4','T5','T6','T7'][d.getDay()],m:0})}
  sessions.forEach(s=>{const k=dayKey(new Date(s.d));const d=days.find(x=>x.k===k);if(d)d.m+=s.sec/60});
  const max=Math.max(10,...days.map(d=>d.m));const W=340,H=130,bw=30;
  const bars=days.map((d,i)=>{const h=Math.round(d.m/max*90);const xx=14+i*46;return `<rect x="${xx}" y="${100-h}" width="${bw}" height="${Math.max(h,2)}" rx="7" fill="${d.m?'var(--sky)':'var(--line)'}"/><text x="${xx+bw/2}" y="${118}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--muted)">${d.l}</text>${d.m?`<text x="${xx+bw/2}" y="${96-h}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">${Math.max(1,Math.round(d.m))}′</text>`:''}`}).join('');
  const total=Math.round(days.reduce((a,d)=>a+d.m,0));
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Số phút học 7 ngày qua">${bars}</svg>`,total};
}
function parentTips(c){
  const tips=[];
  const tops=Object.entries(c.topic).filter(([k,v])=>v.t>=4).map(([k,v])=>({k,p:pct(v.c,v.t)})).sort((a,b)=>a.p-b.p);
  if(tops.length&&tops[0].p<70)tips.push(`Con còn gặp khó ở <b>${TOPICS[tops[0].k]}</b> (đúng ${tops[0].p}%). Bố mẹ thử cùng con làm vài bài loại này bằng đồ vật thật như kẹo, que tính.`);
  if(tops.length&&tops[tops.length-1].p>=85)tips.push(`Con làm rất tốt <b>${TOPICS[tops[tops.length-1].k]}</b>. Hãy khen cụ thể: “Con cộng nhẩm nhanh hơn hẳn tuần trước!”`);
  const de=c.level.de;if(de.t>=30&&pct(de.c,de.t)>=85&&c.level.vua.t<10)tips.push('Mức Dễ đã khá vững. Bố mẹ có thể khuyến khích con thử chặng Vừa.');
  if(c.streak.n>=3)tips.push(`Con đã học ${c.streak.n} ngày liền. Duy trì thói quen quan trọng hơn học nhiều một lúc.`);
  tips.push('Khen sự cố gắng thay vì chỉ khen điểm số, để con không sợ sai.');
  tips.push('10 đến 15 phút mỗi ngày hiệu quả hơn một buổi dài cuối tuần.');
  tips.push('Cùng con xem bộ sưu tập nhãn dán và hỏi con muốn chinh phục cúp nào tiếp theo.');
  return tips.slice(0,5);
}
function renderDash(){
  if(!S.children.length)return go('onboard');
  if(!dashKid||!S.children.find(k=>k.id===dashKid))dashKid=kid().id;
  const c=S.children.find(k=>k.id===dashKid);
  const wk=weekChart(c.sessions);
  const tops=Object.entries(c.topic).map(([k,v])=>({k,v,p:pct(v.c,v.t)})).sort((a,b)=>a.p-b.p);
  const streak=c.streak.last===dayKey()||c.streak.last===dayKey(new Date(Date.now()-864e5))?c.streak.n:0;
  app.innerHTML=`
  <div class="row between" style="margin-bottom:12px"><h2 style="margin:0">Góc phụ huynh</h2><button class="btn ghost small" id="lock">🔒 Khoá</button></div>
  <div class="kidtabs">${S.children.map(k=>`<button data-k="${k.id}" aria-pressed="${k.id===c.id}">${k.avatar} ${esc(k.name)}</button>`).join('')}<button id="addk">＋ Thêm bé</button></div>
  <div class="panel">
    <div class="stats">
      <div class="stat"><b>${fmt(c.points)}</b><small>Tổng điểm</small></div>
      <div class="stat"><b>${pct(c.correct,c.answered)}%</b><small>Tỉ lệ đúng</small></div>
      <div class="stat"><b>${c.sessions.length}</b><small>Bài đã làm</small></div>
      <div class="stat"><b>${streak} ngày</b><small>Chuỗi học liên tục</small></div>
      <div class="stat"><b>${Math.round(c.timeSec/60)} phút</b><small>Tổng thời gian học</small></div>
      <div class="stat"><b>${c.stars} ⭐</b><small>Sao đã đạt</small></div>
    </div>
  </div>
  <div class="panel"><h3 class="sub">Số câu đúng mỗi bài (14 bài gần nhất)</h3><div class="chartbox">${accuracyChart(c.sessions)}</div></div>
  <div class="panel"><div class="row between"><h3 class="sub">Thời gian học 7 ngày qua</h3><b class="muted">${wk.total} phút</b></div><div class="chartbox">${wk.svg}</div></div>
  <div class="panel"><h3 class="sub">Theo mức độ</h3>
    ${Object.entries(LEVELS).map(([k,L])=>{const v=c.level[k];return `<div class="trow"><span>${L.icon} ${L.name}</span><div class="bar ${k==='de'?'grass':''}"><i style="width:${pct(v.c,v.t)}%"></i></div><span>${v.t?pct(v.c,v.t)+'%':'—'}</span></div>`}).join('')}
  </div>
  <div class="panel"><h3 class="sub">Theo dạng bài</h3>
    ${tops.length?tops.map(t=>`<div class="trow"><span>${TOPICS[t.k]}${t.v.t>=4&&t.p<60?'<span class="tag">Cần luyện</span>':''}</span><div class="bar ${t.p>=80?'grass':''}"><i style="width:${t.p}%"></i></div><span>${t.p}%</span></div>`).join(''):'<p class="muted">Chưa có dữ liệu.</p>'}
  </div>
  <div class="panel"><h3 class="sub">Gợi ý cho bố mẹ</h3><ul class="tips">${parentTips(c).map(t=>`<li>${t}</li>`).join('')}</ul></div>
  <div class="panel"><h3 class="sub">Lịch sử gần đây</h3>
    ${c.sessions.length?`<ul class="hist">${c.sessions.slice(-10).reverse().map(s=>`<li><span>${new Date(s.d).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})} ${new Date(s.d).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})} · ${LEVELS[s.lv].name}</span><span>${s.c}/10 ${'⭐'.repeat(s.st)}</span></li>`).join('')}</ul>`:'<p class="muted">Con chưa làm bài nào.</p>'}
  </div>
  <div class="panel"><h3 class="sub">Cài đặt cho ${esc(c.name)}</h3>
    <div class="setting"><span><b>Mục tiêu mỗi ngày</b><br><small class="muted">Số bài con cần hoàn thành</small></span>
      <div class="stepper"><button class="btn ghost small" id="g-" aria-label="Giảm">−</button><span>${c.goal}</span><button class="btn ghost small" id="g+" aria-label="Tăng">＋</button></div></div>
    <div class="setting"><span><b>Lớp</b></span><div class="picks">${[1,2,3,4,5].map(g=>`<button class="pick txt" data-gr="${g}" aria-pressed="${c.grade===g}" style="min-width:44px;height:44px">${g}</button>`).join('')}</div></div>
    <div class="setting" style="flex-wrap:wrap"><span><b>Giai đoạn học</b><br><small class="muted">${CURR[c.grade][stageOf(c)].desc}</small></span>
      <div class="picks">${STAGE_SHORT.map((t,i)=>`<button class="pick txt" data-st="${i}" aria-pressed="${stageOf(c)===i}" style="height:44px;font-size:1rem">${t}</button>`).join('')}</div></div>
    <div class="setting"><span><b>Tự chuyển theo tháng</b><br><small class="muted">Tháng 9–10: đầu HK1 · 11–1: cuối HK1 · 2–3: đầu HK2 · 4–5: cuối HK2</small></span><button class="switch" role="switch" id="auto" aria-checked="${c.stage===null||c.stage===undefined}" aria-label="Tự chuyển giai đoạn theo tháng"></button></div>
    <div class="setting"><span><b>Mở tất cả chặng</b><br><small class="muted">Bỏ qua điều kiện số sao</small></span><button class="switch" role="switch" id="unl" aria-checked="${c.unlockAll}" aria-label="Mở tất cả chặng"></button></div>
    <div class="setting"><span><b>Học bằng tài khoản này</b></span><button class="btn grass small" id="use">${S.active===c.id?'Đang chọn':'Chọn bé này'}</button></div>
    <div class="setting"><span><b>Xoá dữ liệu học</b><br><small class="muted">Không thể hoàn tác</small></span><button class="btn coral small" id="reset">Xoá</button></div>
  </div>
  <p class="muted center" style="font-size:.85rem;font-weight:700">Tiến độ được lưu vào tài khoản Claude của bạn và đồng bộ khi mở trang trên thiết bị khác.</p>`;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{dashKid=b.dataset.k;renderDash()});
  $('#addk').onclick=()=>go('onboard');
  $('#lock').onclick=()=>{parentOpen=false;go('home')};
  $('#g-').onclick=()=>{c.goal=Math.max(1,c.goal-1);save();renderDash()};
  $('#g+').onclick=()=>{c.goal=Math.min(6,c.goal+1);save();renderDash()};
  app.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>{c.grade=+b.dataset.gr;save();renderDash();toast(`Đã chuyển sang lớp ${c.grade}`)});
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{c.stage=+b.dataset.st;save();renderDash();toast(`Đã chuyển sang ${STAGES[c.stage].toLowerCase()}`)});
  $('#auto').onclick=()=>{c.stage=(c.stage===null||c.stage===undefined)?autoStage():null;save();renderDash()};
  $('#unl').onclick=()=>{c.unlockAll=!c.unlockAll;save();renderDash()};
  $('#use').onclick=()=>{S.active=c.id;save();renderDash();toast(`${c.name} đang học`)};
  $('#reset').onclick=()=>{
    const m=document.createElement('div');m.className='modal';
    m.innerHTML=`<div class="panel center"><h2>Xoá dữ liệu của ${esc(c.name)}?</h2><p class="muted">Toàn bộ điểm, sao, huy hiệu và lịch sử sẽ bị xoá.</p>
      <div class="row" style="justify-content:center;margin-top:12px;flex-wrap:wrap"><button class="btn ghost" id="cn">Giữ lại</button><button class="btn coral" id="rs">Chỉ xoá điểm</button><button class="btn coral" id="rm">Xoá cả hồ sơ</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector('#cn').onclick=()=>m.remove();
    m.querySelector('#rs').onclick=()=>{const n=newChild(c.name,c.grade,c.avatar);n.id=c.id;n.goal=c.goal;n.stage=c.stage;Object.assign(c,n);save();m.remove();renderDash();toast('Đã xoá điểm')};
    m.querySelector('#rm').onclick=()=>{S.children=S.children.filter(k=>k.id!==c.id);if(S.active===c.id)S.active=S.children[0]?.id||null;dashKid=null;save();m.remove();S.children.length?renderDash():go('onboard')};
  };
}

/* ---------- Boot ---------- */
loadLocal();
go(S.children.length?'home':'onboard');
connectCloud();
</script>
